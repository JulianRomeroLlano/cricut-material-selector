<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricut Material Selector</title>
  <meta name="description" content="Official cut settings for 1 039 Cricut materials, plus AI prediction for any unlisted material.">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <div class="accent-stripe"></div>

  <header class="header">
    <div class="brand">
      <span class="brand-spark" aria-hidden="true">✦</span>
      <span class="brand-title" data-i18n="app_title">Material Selector</span>
      <span class="brand-sub" data-i18n="app_for">for Cricut</span>
    </div>
    <button class="lang-btn" id="langToggle" aria-label="Toggle language">JP</button>
  </header>

  <nav class="mode-nav" role="tablist" aria-label="App mode">
    <button class="mode-btn active" id="tabBrowse" role="tab"
            aria-selected="true" data-i18n="mode_browse">Browse Materials</button>
    <button class="mode-btn" id="tabPredict" role="tab"
            aria-selected="false" data-i18n="mode_predict">✦ AI Predict</button>
  </nav>

  <!-- ── Browse panel ────────────────────────────────────────────────────────── -->
  <section id="browsePanel" class="panel" role="tabpanel" aria-labelledby="tabBrowse">

    <div class="machine-bar" id="machineBar" role="group" aria-label="Machine"></div>

    <div class="toolbar" role="search">
      <div class="search-field">
        <span class="search-icon" aria-hidden="true">&#128269;</span>
        <input type="search" id="searchInput"
               placeholder="Search materials…"
               data-i18n-placeholder="search_placeholder"
               autocomplete="off" spellcheck="false">
      </div>
      <select class="filter-select" id="filterCategory" aria-label="Category"></select>
      <select class="filter-select" id="filterBlade"    aria-label="Blade"></select>
      <button class="sort-toggle" id="sortToggle" aria-label="Toggle sort by pressure"
              data-i18n="sort_default">Sort</button>
    </div>

    <div class="result-count" id="resultCount"
         aria-live="polite" aria-atomic="true"></div>
    <div class="mat-list" id="matList" role="list"></div>

  </section>

  <!-- ── AI Predict panel ───────────────────────────────────────────────────── -->
  <section id="predictPanel" class="panel hidden"
           role="tabpanel" aria-labelledby="tabPredict">

    <div class="predict-hero">
      <h2 data-i18n="predict_title">AI Cut Settings Predictor</h2>
      <p data-i18n="predict_sub">Get estimated settings for any material not in the official list.</p>
    </div>

    <div class="predict-form">
      <div class="form-row">
        <label class="form-label" for="pMachine" data-i18n="form_machine">Machine</label>
        <select class="form-select" id="pMachine"></select>
      </div>

      <div class="form-row">
        <label class="form-label" for="pCategory" data-i18n="form_category">Material Type</label>
        <select class="form-select" id="pCategory"></select>
      </div>

      <div class="form-row">
        <label class="form-label" for="pThickness" data-i18n="form_thickness">Thickness</label>
        <div class="input-group">
          <input class="form-input" type="number" id="pThickness"
                 min="0.01" max="60" step="0.01" value="0.08">
          <span class="input-unit">mm</span>
        </div>
        <span class="field-error hidden" id="errThickness"></span>
      </div>

      <button class="btn-cta" id="btnPredict" data-i18n="btn_predict">
        Predict Cut Settings
      </button>
    </div>

    <div id="predictResult" class="hidden" aria-live="polite"></div>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/predict.js"></script>
  <script src="assets/js/app.js"></script>

</body>
</html>
